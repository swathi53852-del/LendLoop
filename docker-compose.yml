
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/lendloop
    ports:
      - "5003:5000"
    depends_on:
      - mongo

  client:
    build: ./client
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://server:5000
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mongo_data: